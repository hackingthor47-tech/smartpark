<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkSmart | Hardware Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#061225;--nav:#041126;--card:#0c2038;--line:#203d5b;--cyan:#4bd4ff;--muted:#a9bdd5;--white:#f5f9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--nav);border-right:1px solid #1b2c43;padding:25px 17px}
.brand{font-size:22px;font-weight:850;color:#60d7ff;margin:0 0 35px}
nav a{display:block;padding:13px 14px;border-radius:11px;color:var(--muted);margin:5px 0}
nav a.active,nav a:hover{background:#102c49;color:var(--cyan)}
main{padding:34px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.kicker{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:1.8px}
h1{font-size:32px;margin:9px 0}.muted{color:var(--muted);font-size:14px}
.pill{padding:9px 13px;border-radius:30px;background:#123b35;color:#67f2c5;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:25px}
.card{background:linear-gradient(145deg,#102c49,#081a30);border:1px solid var(--line);border-radius:20px;padding:23px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center}
.caricon{width:58px;height:58px;border-radius:16px;background:#12466a;display:grid;place-items:center;color:#a6eaff}
.caricon svg{width:35px;height:35px}
.status{font-size:11px;font-weight:850;padding:8px 12px;border-radius:30px;background:#123b35;color:#67f2c5}
.status.occupied{background:#48252e;color:#ff9ba9}.status.reserved{background:#45371d;color:#ffd77c}
.card h2{font-size:21px;margin:22px 0 7px}.slotid{color:#7f9bb9;font-size:12px;letter-spacing:1px}
.gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
.gate{display:flex;align-items:center;gap:16px}.gateicon{width:52px;height:52px;border-radius:15px;background:#12466a;display:grid;place-items:center;color:#a6eaff;font-size:25px}
.gate h3{margin:0 0 8px;font-size:17px}.notice{margin-top:20px;padding:15px 18px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.5;background:#091a2d}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{padding:15px;border-right:0;border-bottom:1px solid #1b2c43}.brand{margin:0 0 12px}nav{display:flex;gap:5px;flex-wrap:wrap}nav a{padding:9px 11px;margin:0}main{padding:20px}.grid,.gates{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand">▣ ParkSmart</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="consumer.html">Consumer</a>
    <a class="active" href="hardware.html">Hardware</a>
    <a href="admin.html">Admin</a>
  </nav>
</aside>

<main>
  <header class="top">
    <div>
      <div class="kicker">LIVE IOT MONITORING</div>
      <h1>Hardware Dashboard</h1>
      <div class="muted">Live parking occupancy and gate status</div>
    </div>
    <span class="pill" id="connection">Connecting to Firebase…</span>
  </header>

  <section class="grid" id="slots"></section>
  <section class="gates" id="gates"></section>

  <div class="notice">
    Slot and gate states are read from Firebase. Gate status shows the reported state; it does not operate a physical servo.
  </div>
</main>
</div>

<script>
const firebaseConfig = {

1:423958538578:web:b7c5395f8348e3a00f728b
SDK setup and configuration

const firebaseConfig = {
  apiKey: "AIzaSyAsffyVnKES_-tZz3pnuojPLPFBk3TJe5E",
  authDomain: "smartpark-9ecbb.firebaseapp.com",
  databaseURL: "https://smartpark-9ecbb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smartpark-9ecbb",
  storageBucket: "smartpark-9ecbb.firebasestorage.app",
  messagingSenderId: "423958538578",
  appId: "1:423958538578:web:b7c5395f8348e3a00f728b"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const carSvg = `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="m3 13 2-6h14l2 6v6H3z"/>
  <path d="M5 13h14M7 17h.01M17 17h.01M7 7l1-3h8l1 3"/>
</svg>`;

const slotIds = ["slot1","slot2","slot3","slot4"];

function renderSlots(slots, bookings = {}) {
  document.getElementById("slots").innerHTML = slotIds.map((id,index) => {
    const sensor = String(slots[id] || "UNKNOWN").toUpperCase();
    const reserved = Object.values(bookings).some(
      b => b && b.slot === id && b.status === "ACTIVE"
    );

    const state = sensor === "OCCUPIED" ? "OCCUPIED"
      : reserved ? "RESERVED"
      : sensor === "AVAILABLE" ? "AVAILABLE"
      : "UNKNOWN";

    const cls = state === "OCCUPIED" ? "occupied"
      : state === "RESERVED" ? "reserved" : "";

    return `
      <article class="card">
        <div class="cardhead">
          <span class="caricon">${carSvg}</span>
          <span class="status ${cls}">${state}</span>
        </div>
        <h2>Parking Slot ${index + 1}</h2>
        <div class="slotid">${id.toUpperCase()}</div>
      </article>`;
  }).join("");
}

function renderGates(data) {
  const gateIds = ["entry","exit"];
  document.getElementById("gates").innerHTML = gateIds.map(id => {
    const state = String(data[id] || "CLOSED").toUpperCase();
    return `
      <article class="card gate">
        <span class="gateicon">↔</span>
        <div>
          <div class="kicker">${id.toUpperCase()} GATE</div>
          <h3>${state === "OPEN" ? "OPEN" : "CLOSED"}</h3>
          <div class="muted">Firebase reported state</div>
        </div>
      </article>`;
  }).join("");
}

auth.signInAnonymously().then(() => {
  document.getElementById("connection").textContent = "● Firebase connected";

  db.ref("parksmart/slots").on("value", snapshot => {
    renderSlots(snapshot.val() || {});
  });

  db.ref("parksmart/bookings").on("value", snapshot => {
    db.ref("parksmart/slots").once("value").then(slotSnapshot => {
      renderSlots(slotSnapshot.val() || {}, snapshot.val() || {});
    });
  });

  db.ref("parksmart/gate").on("value", snapshot => {
    renderGates(snapshot.val() || {});
  });
}).catch(error => {
  document.getElementById("connection").textContent = "Firebase error";
  document.getElementById("slots").innerHTML =
    `<article class="card">${error.message}</article>`;
});
</script>
</body>
</html>
