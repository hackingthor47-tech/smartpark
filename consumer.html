<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkSmart | Consumer Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#061225;--nav:#041126;--line:#203d5b;--cyan:#4bd4ff;--muted:#a9bdd5;--white:#f5f9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--nav);border-right:1px solid #1b2c43;padding:25px 17px}
.brand{font-size:22px;font-weight:850;color:#60d7ff;margin:0 0 35px}
nav a{display:block;padding:13px 14px;border-radius:11px;color:var(--muted);margin:5px 0}
nav a.active,nav a:hover{background:#102c49;color:var(--cyan)}
main{padding:34px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.kicker{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:1.8px}
h1{font-size:32px;margin:9px 0}.muted{color:var(--muted);font-size:14px}
.pill{padding:9px 13px;border-radius:30px;background:#123b35;color:#67f2c5;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:25px}
.card,.panel{background:linear-gradient(145deg,#102c49,#081a30);border:1px solid var(--line);border-radius:20px;padding:23px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center}
.caricon{width:58px;height:58px;border-radius:16px;background:#12466a;display:grid;place-items:center;color:#a6eaff}
.caricon svg{width:35px;height:35px}
.status{font-size:11px;font-weight:850;padding:8px 12px;border-radius:30px;background:#123b35;color:#67f2c5}
.status.occupied{background:#48252e;color:#ff9ba9}.status.reserved{background:#45371d;color:#ffd77c}
.card h2{font-size:21px;margin:22px 0 7px}.slotid{color:#7f9bb9;font-size:12px;letter-spacing:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:11px;padding:12px 15px;background:linear-gradient(110deg,#12b9f5,#0872ed);color:#fff;font-weight:800;cursor:pointer}
.btn.secondary{background:#102c49;border:1px solid #315273}.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{margin-top:22px}.panel h2{margin:10px 0}.notice{color:var(--muted);font-size:13px;line-height:1.5}
.field{width:100%;padding:12px;border:1px solid #315273;background:#07172b;color:#fff;border-radius:10px;margin:7px 0 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{padding:15px;border-right:0;border-bottom:1px solid #1b2c43}.brand{margin:0 0 12px}nav{display:flex;gap:5px;flex-wrap:wrap}nav a{padding:9px 11px;margin:0}main{padding:20px}.grid{grid-template-columns:1fr}h1{font-size:27px}}
@media(max-width:560px){.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand">▣ ParkSmart</div>
  <nav>
    <a href="index.html">Home</a>
    <a class="active" href="consumer.html">Consumer</a>
    <a href="hardware.html">Hardware</a>
    <a href="admin.html">Admin</a>
  </nav>
</aside>

<main>
  <header class="top">
    <div>
      <div class="kicker">YOUR PARKING WORKSPACE</div>
      <h1>Consumer Dashboard</h1>
      <div class="muted" id="venueLine">Find a slot, book it, and save your parking location.</div>
    </div>
    <span class="pill" id="authState">Connecting…</span>
  </header>

  <section class="grid" id="slots"></section>

  <section class="panel">
    <div class="kicker">PARKING MEMORY</div>
    <h2>Save My Parking</h2>
    <p class="notice">Save the selected QR location or your active booking to Firebase.</p>

    <div class="formgrid">
      <div>
        <label class="notice" for="saveLabel">Parking label</label>
        <input class="field" id="saveLabel" placeholder="e.g. Level 2, Slot 4">
      </div>
      <div>
        <label class="notice" for="saveAddress">Venue / address</label>
        <input class="field" id="saveAddress" placeholder="Venue name or address">
      </div>
    </div>

    <div class="row">
      <button class="btn" id="saveBtn">Save My Parking</button>
      <button class="btn secondary" id="findBtn">Find My Vehicle</button>
    </div>
    <div id="savedResult" class="notice" style="margin-top:14px"></div>
  </section>
</main>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAsffyVnKES_-tZz3pnuojPLPFBk3TJe5E",
  authDomain: "smartpark-9ecbb.firebaseapp.com",
  databaseURL: "https://smartpark-9ecbb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smartpark-9ecbb",
  storageBucket: "smartpark-9ecbb.firebasestorage.app",
  messagingSenderId: "423958538578",
  appId: "1:423958538578:web:b7c5395f8348e3a00f728b"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let user = null;
let slotData = {};
let bookings = {};
let qrLocation = null;

const slotIds = ["slot1","slot2","slot3","slot4"];

const carSvg = `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="m3 13 2-6h14l2 6v6H3z"/>
  <path d="M5 13h14M7 17h.01M17 17h.01M7 7l1-3h8l1 3"/>
</svg>`;

function activeBooking(slotId) {
  return Object.entries(bookings).find(
    ([key,b]) => b && b.slot === slotId && b.status === "ACTIVE"
  );
}

function renderSlots() {
  document.getElementById("slots").innerHTML = slotIds.map((id,index) => {
    const sensor = String(slotData[id] || "UNKNOWN").toUpperCase();
    const active = activeBooking(id);
    const reserved = Object.values(bookings).some(
      b => b && b.slot === id && b.status === "ACTIVE"
    );

    const state = sensor === "OCCUPIED" ? "OCCUPIED"
      : reserved ? "RESERVED"
      : sensor === "AVAILABLE" ? "AVAILABLE"
      : "UNKNOWN";

    const cls = state === "OCCUPIED" ? "occupied"
      : state === "RESERVED" ? "reserved" : "";

    const isMine = active && active[1].uid === user.uid;
    const action = isMine
      ? `<button class="btn secondary" onclick="cancelBooking('${active[0]}')">Cancel Booking</button>`
      : state === "AVAILABLE"
        ? `<button class="btn" onclick="bookSlot('${id}')">Book My Slot</button>`
        : `<button class="btn" disabled>Not Available</button>`;

    return `
      <article class="card">
        <div class="cardhead">
          <span class="caricon">${carSvg}</span>
          <span class="status ${cls}">${state}</span>
        </div>
        <h2>Parking Slot ${index + 1}</h2>
        <div class="slotid">${id.toUpperCase()} · Sensor: ${sensor}</div>
        <div class="row">
          ${action}
          <button class="btn secondary" onclick="selectSlot('${id}')">Save My Parking</button>
        </div>
      </article>`;
  }).join("");
}

async function bookSlot(slotId) {
  const ref = db.ref("parksmart/bookings/" + slotId);
  try {
    const result = await ref.transaction(current => {
      if (current && current.status === "ACTIVE") return;
      return {
        uid: user.uid,
        name: user.displayName || user.email || "ParkSmart user",
        email: user.email || "",
        vehicle: "",
        slot: slotId,
        status: "ACTIVE",
        createdAt: Date.now(),
        venueId: qrLocation?.venueId || "",
        venueName: qrLocation?.venueName || "ParkSmart"
      };
    });
    if (!result.committed) alert("This slot is already booked.");
  } catch (error) {
    alert(error.message);
  }
}

async function cancelBooking(slotId) {
  const ref = db.ref("parksmart/bookings/" + slotId);
  const snapshot = await ref.get();
  const booking = snapshot.val();

  if (!booking || booking.uid !== user.uid) {
    alert("You can cancel only your own booking.");
    return;
  }

  await ref.update({
    status: "CANCELLED",
    cancelledAt: Date.now()
  });
}

function selectSlot(slotId) {
  document.getElementById("saveLabel").value =
    (qrLocation?.label ? qrLocation.label + " · " : "") + slotId.toUpperCase();

  document.getElementById("saveAddress").value =
    qrLocation?.venueName || "";

  document.getElementById("savedResult").textContent =
    "Slot selected. Tap Save My Parking to store it.";
}

document.getElementById("saveBtn").onclick = async () => {
  const active = Object.values(bookings).find(
    b => b && b.uid === user.uid && b.status === "ACTIVE"
  );

  const label = document.getElementById("saveLabel").value.trim()
    || qrLocation?.label
    || active?.slot
    || "";

  if (!label) {
    alert("Select a slot or enter a parking label.");
    return;
  }

  const record = {
    label,
    address: document.getElementById("saveAddress").value.trim()
      || qrLocation?.venueName || "",
    venueId: qrLocation?.venueId || active?.venueId || "",
    venueName: qrLocation?.venueName || active?.venueName || "",
    slot: active?.slot || "",
    savedAt: Date.now()
  };

  await db.ref("parksmart/vehicleLocations/" + user.uid).set(record);
  document.getElementById("savedResult").textContent =
    "Parking location saved to Firebase: " + label;
};

document.getElementById("findBtn").onclick = async () => {
  const snapshot = await db.ref(
    "parksmart/vehicleLocations/" + user.uid
  ).get();

  const saved = snapshot.val();

  if (!saved) {
    document.getElementById("savedResult").textContent =
      "No saved parking location found.";
    return;
  }

  let result = `Saved location: ${saved.label} · ${saved.venueName || saved.address || ""}`;

  if (saved.address) {
    result += ` · <a style="color:#55d8ff" target="_blank" rel="noopener"
      href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(saved.address)}">Directions ↗</a>`;
  }

  document.getElementById("savedResult").innerHTML = result;
};

async function loadQrLocation() {
  const locationId = new URLSearchParams(location.search).get("locationId");
  if (!locationId) return;

  const snapshot = await db.ref("parksmart/locations/" + locationId).get();
  qrLocation = snapshot.val();

  if (!qrLocation) {
    document.getElementById("venueLine").textContent =
      "QR location not found in Firebase.";
    return;
  }

  document.getElementById("venueLine").textContent =
    `${qrLocation.venueName || "Parking venue"} · ${qrLocation.label || "Selected location"}`;

  document.getElementById("saveLabel").value = qrLocation.label || "";
  document.getElementById("saveAddress").value = qrLocation.venueName || "";
}

auth.signInAnonymously().then(async credential => {
  user = credential.user;
  document.getElementById("authState").textContent = "● Signed in";

  await loadQrLocation();

  db.ref("parksmart/slots").on("value", snapshot => {
    slotData = snapshot.val() || {};
    renderSlots();
  });

  db.ref("parksmart/bookings").on("value", snapshot => {
    bookings = snapshot.val() || {};
    renderSlots();
  });
}).catch(error => {
  document.getElementById("authState").textContent = "Auth error";
  document.getElementById("slots").innerHTML =
    `<article class="card">${error.message}</article>`;
});
</script>
</body>
</html>
